server {
    listen 80;
    # ローカルでは localhost または任意の名前
    server_name localhost;
    root /var/www/public;

    index index.php index.html;
    charset utf-8;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # アップロードサイズ上限
    client_max_body_size 25M;

    # SSL設定はローカルではすべてコメントアウト（または削除）
    # ssl_certificate ...
    # ssl_certificate_key ...

    # ==========================================
    # ★大手術1: データ超圧縮（Gzip）設定
    # Lighthouse警告「テキスト圧縮の有効化」を解決し、通信量を激減させます
    # ==========================================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # OGP動的画像: .png だがLaravel経由で生成するためPHPに転送
    # ogp.png, review-ogp.png, review-ogp/{id}.png を対象
    location ~ ^/(blog|bikes|touring)/.+/(ogp|review-ogp(/\d+)?)\.png$ {
        try_files $uri /index.php?$query_string;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # 埋め込みウィジェット用スクリプト: 外部サイトが ?v= 無しで読み込むため immutable 不可。
    # 本番(default.prod.conf)と挙動を揃え、1時間キャッシュ + stale-while-revalidate にする。
    # （汎用 js/css ルールに飲まれると 30日 immutable になり修正が伝播しない罠を回避）
    location = /widget/price.js {
        access_log off;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # ==========================================
    # ★大手術2: 静的ファイルのブラウザキャッシュ設定
    # Lighthouse警告「効率的なキャッシュ保存期間を使用する」を完全に消滅させます
    # ==========================================
    location ~* \.(jpg|jpeg|gif|png|webp|css|js|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # Laravelのルーティングに邪魔されないようにファイルがなければ404を返す
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}