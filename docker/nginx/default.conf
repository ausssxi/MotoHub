server {
    listen 80;
    # ローカルでは localhost または任意の名前
    server_name localhost;
    root /var/www/public;

    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # SSL設定はローカルではすべてコメントアウト（または削除）
    # ssl_certificate ...
    # ssl_certificate_key ...

    # ==========================================
    # ★大手術1: データ超圧縮（Gzip）設定
    # Lighthouse警告「テキスト圧縮の有効化」を解決し、通信量を激減させます
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # ==========================================
    # ★大手術2: 静的ファイルのブラウザキャッシュ設定
    # Lighthouse警告「効率的なキャッシュ保存期間を使用する」を完全に消滅させます
    # ==========================================
    location ~* \.(jpg|jpeg|gif|png|webp|css|js|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        # Laravelのルーティングに邪魔されないようにファイルがなければ404を返す
        try_files $uri =404; 
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}