server {
    listen 80;
    server_name motohub.jp www.motohub.jp;

    # 全ての HTTP リクエストを HTTPS へ強制リダイレクト
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name motohub.jp www.motohub.jp;
    root /var/www/public;

    # SSL証明書の設定（docker-compose.yml でマウントしたパスを指定）
    ssl_certificate     /etc/letsencrypt/live/motohub.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motohub.jp/privkey.pem;

    # SSL推奨設定（セキュリティ向上）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}