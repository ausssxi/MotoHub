server {
    listen 80;
    server_name motohub.jp;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # ローカルでは localhost または任意の名前
    server_name motohub.jp;
    root /var/www/public;

    index index.php index.html;
    charset utf-8;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # アップロードサイズ上限
    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/motohub.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motohub.jp/privkey.pem;

    # ==========================================
    # ★大手術1: データ超圧縮（Gzip）設定
    # Lighthouse警告「テキスト圧縮の有効化」を解決し、通信量を激減させます
    # ==========================================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # OGP動的画像: .png だがLaravel経由で生成するためPHPに転送
    # ogp.png, review-ogp.png, review-ogp/{id}.png を対象
    location ~ ^/(blog|bikes|touring)/.+/(ogp|review-ogp(/\d+)?)\.png$ {
        try_files $uri /index.php?$query_string;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # ==========================================
    # ★大手術2: 静的ファイルのブラウザキャッシュ設定
    # Lighthouse警告「効率的なキャッシュ保存期間を使用する」を完全に消滅させます
    # ==========================================

    # Vite ビルド資産: ファイル名に内容ハッシュを含むため永続 immutable で安全
    # (^~ により下の正規表現 location より優先される)
    location ^~ /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 画像・フォント: ファイル名固定・変更頻度が低いので長期 immutable のまま
    location ~* \.(jpg|jpeg|gif|png|webp|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # Laravelのルーティングに邪魔されないようにファイルがなければ404を返す
        try_files $uri =404;
    }

    # Livewire/Filament の動的アセット・エンドポイント（/livewire/livewire.js 等）は
    # ファイルではなくLaravelのルートなので、下の静的 js/css 規則に飲ませず PHP に通す。
    # ^~ プレフィックスは正規表現ロケーションより優先される。これが無いと livewire.js が
    # nginx 404 → Alpine未初期化 → x-cloakで管理画面(Filament)が全画面空白になる。
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    # 埋め込みウィジェット用スクリプト: 外部サイトが ?v= 無しで読み込むため、
    # Cache-Control が修正の伝播速度を直接決める。汎用 js/css ルール（?v= busting 前提）
    # から切り離して個別管理する。1時間は通常キャッシュ（高速・リクエスト0）、その後は
    # stale-while-revalidate でバックグラウンド更新 → 体感速度を保ちつつ数時間〜1日で行き渡る。
    # ※ immutable は絶対に付けない（バージョン文字列が無いため）。expires は付けず
    #    add_header のみで単一の Cache-Control を出力（ETag/Last-Modified は自動付与）。
    location = /widget/price.js {
        access_log off;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # 自前の JS/CSS (public/js, public/css): ?v=内容ハッシュ でバスティングするため
    # immutable は付けない。内容変更時に確実に再取得させ、過去の immutable キャッシュも救済する。
    location ~* \.(css|js)$ {
        expires 1h;
        access_log off;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}