*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e}
body{font-family:'Noto Sans JP',sans-serif;color:#e0e0e0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
button,input,select,textarea{color:inherit;font:inherit}
#app{width:100%;height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column}

@keyframes ws-fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes ws-popIn{0%{transform:scale(0)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes ws-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

@keyframes ws-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ws-slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes ws-glow{0%{box-shadow:0 0 0 rgba(255,215,0,0)}50%{box-shadow:0 0 40px rgba(255,215,0,.6)}100%{box-shadow:0 0 0 rgba(255,215,0,0)}}

input[type=range].ws-vol{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.25);outline:none}
input[type=range].ws-vol::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#e94560;cursor:pointer}
input[type=range].ws-vol::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#e94560;cursor:pointer;border:none}

.ws-btn{border:none;border-radius:8px;padding:12px 24px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:transform .1s;color:#fff;line-height:1.4}
.ws-btn:active{transform:scale(.95)}
.ws-btn-accent{background:#e94560}
.ws-btn-card{background:#16213e;border:1px solid rgba(255,255,255,.15)}
.ws-btn-success{background:#4caf50}
.ws-btn-gold{background:#ffd700;color:#1a1a2e}
.ws-card{background:#16213e;border-radius:12px;padding:16px;margin:8px 0;color:#e0e0e0}

.ws-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.ws-overlay{position:absolute;inset:0;z-index:0}
.ws-content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0}

.ws-npc-img{width:180px;height:180px;object-fit:contain;filter:drop-shadow(0 4px 16px rgba(0,0,0,.6))}
@media(max-width:768px){
  .ws-npc-img{max-height:25vh!important;width:auto!important}
}

[x-cloak]{display:none!important}

.ws-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px}
.ws-bottom-pad{padding:8px 16px 16px;flex-shrink:0}
.ws-scene-col{flex:1;display:flex;flex-direction:column;overflow:hidden;max-width:480px;margin:0 auto;width:100%}
</style>

};

  '蕎麦屋のゲンさんが引退することになった。',
  '『出前用のカブ、余っちまったからよ。持ってきな。』',

  'カブ一台から始まる、交換の旅。',
];

/* ═══════════════════════════════════════════
   Audio Manager
   ═══════════════════════════════════════════ */
class AudioMgr {
  constructor() {
    this._bgm = null; this._bgmKey = null; this._bgmPlaying = false;
    this._vol = 0.5; this._muted = false; this._unlocked = false;
    try { const s = JSON.parse(localStorage.getItem(AUDIO_KEY)); if (s) { this._vol = s.vol ?? 0.5; this._muted = s.muted ?? false; } } catch {}
  }
  _persist() { try { localStorage.setItem(AUDIO_KEY, JSON.stringify({ vol: this._vol, muted: this._muted })); } catch {} }
  unlock() {
    if (this._unlocked) return; this._unlocked = true;
    try { const Ctx = window.AudioContext || window.webkitAudioContext; if (Ctx) { const ctx = new Ctx(); ctx.resume().then(() => ctx.close()).catch(() => {}); } } catch {}
  }
  playBgm(key) {
    if (this._bgmKey === key && this._bgmPlaying) return;
    if (this._bgm) { this._bgm.pause(); this._bgm = null; }
    this._bgmKey = key; this._bgmPlaying = false;
    const url = SND + 'bgm_' + key + '.mp3';
    try {
      const a = new Audio(url); a.loop = true; a.volume = this._muted ? 0 : this._vol;
      a.onerror = () => { this._bgm = null; this._bgmPlaying = false; };
      const p = a.play();
      if (p && p.then) p.then(() => { this._bgmPlaying = true; }).catch(() => { this._bgmPlaying = false; });
      this._bgm = a;
    } catch { this._bgm = null; this._bgmPlaying = false; }
  }
  stopBgm() { if (this._bgm) { this._bgm.pause(); this._bgm = null; this._bgmKey = null; this._bgmPlaying = false; } }
  playSe(key) {
    const url = SND + 'se_' + key + '.mp3';
    try { const a = new Audio(url); a.volume = this._muted ? 0 : this._vol; a.play().catch(() => {}); } catch {}
  }
  setVol(v) { this._vol = v; if (this._bgm) this._bgm.volume = this._muted ? 0 : v; this._persist(); }
  toggleMute() { this._muted = !this._muted; if (this._bgm) this._bgm.volume = this._muted ? 0 : this._vol; this._persist(); return this._muted; }
  get vol() { return this._vol; }
  get muted() { return this._muted; }
}
const audio = new AudioMgr();

/* ═══════════════════════════════════════════
   Save / Load
   ═══════════════════════════════════════════ */
function saveGame(st) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v:1, currentArea:st.currentArea, bikes:st.bikes, parts:st.parts, unlockedAreas:st.unlockedAreas, bikesEverOwned:st.bikesEverOwned, gameClear:st.gameClear })); } catch {}
}
function loadGame() { try { const r = localStorage.getItem(SAVE_KEY); return r ? JSON.parse(r) : null; } catch { return null; } }
function deleteSave() { try { localStorage.removeItem(SAVE_KEY); } catch {} }

/* ═══════════════════════════════════════════
   Helpers
   ═══════════════════════════════════════════ */
function getVisibleNpcs(areaId, state) {
  const area = AREAS[areaId]; if (!area) return [];
  return area.npcs.filter(id => { const npc = NPCS[id]; if (npc.visibleIfBikeEverOwned) return state.bikesEverOwned.includes(npc.visibleIfBikeEverOwned); return true; });
}

function checkNewAreaUnlocks(bikes, currentUnlocked) {
  const unlocked = [...currentUnlocked]; const msgs = [];
  const maxCc = Math.max(0, ...bikes.map(b => BIKES[b]?.ccNum || 0));
  const has = id => bikes.includes(id);
  if (!unlocked.includes('suburb') && has('ct125')) { unlocked.push('suburb'); msgs.push('新エリア「郊外」が開放された！'); }
  if (!unlocked.includes('pass') && maxCc >= 250) { unlocked.push('pass'); msgs.push('新エリア「峠」が開放された！'); }
  if (!unlocked.includes('coast') && maxCc >= 400) { unlocked.push('coast'); msgs.push('新エリア「海岸通り」が開放された！'); }
  if (!unlocked.includes('circuit') && (maxCc >= 600 || has('z900'))) { unlocked.push('circuit'); msgs.push('新エリア「サーキット」が開放された！'); }
  return { unlocked, msgs };
}

function preloadAllImages() {
  Object.values(NPCS).forEach(n => { if (n.image) new Image().src = n.image; });
  Object.values(BIKES).forEach(b => { if (b.icon) new Image().src = b.icon; });
  Object.values(AREAS).forEach(a => { if (a.bg) new Image().src = a.bg; });
  new Image().src = IMG + 'title_screen.png';
}

/* ═══════════════════════════════════════════
   State & Reducer
   ═══════════════════════════════════════════ */
const initialState = {
  phase:'title', currentArea:'street', npcIndex:0, scene:'explore',
  bikes:[], parts:[], selectedBike:null, unlockedAreas:['street'],
  bikesEverOwned:[], gameClear:false,
  activeNpc:null, dialogLines:[], dialogIndex:0, dialogPhase:'idle', synthResult:null,
};

let state = JSON.parse(JSON.stringify(initialState));
let prevDialogPhase = 'idle';
let prevAreasLen = 1;

function reducer(state, action) {
  switch (action.type) {
    case 'START': return { ...state, phase:'prologue' };
    case 'CONTINUE': {
      const s = loadGame();
      if (!s) return { ...state, phase:'prologue' };
      return { ...initialState, phase:'playing', scene:'explore', currentArea:s.currentArea||'street',
        bikes:s.bikes||[], parts:s.parts||[], unlockedAreas:s.unlockedAreas||['street'],
        bikesEverOwned:s.bikesEverOwned||[], gameClear:s.gameClear||false };
    }
    case 'PROLOGUE_END': return { ...state, phase:'playing', scene:'explore', bikes:[], npcIndex:0 };
    case 'NAV': {
      const vis = getVisibleNpcs(state.currentArea, state);
      if (vis.length <= 1) return state;
      return { ...state, npcIndex:(state.npcIndex + action.dir + vis.length) % vis.length };
    }
    case 'TALK': {
      const vis = getVisibleNpcs(state.currentArea, state);
      const npcId = vis[state.npcIndex]; const npc = NPCS[npcId]; if (!npc) return state;
      if (npc.isShop) {
        if (state.bikes.includes('cub50'))
          return { ...state, scene:'dialog', activeNpc:npcId, dialogLines:[npc.alreadyOwned], dialogIndex:0, dialogPhase:'shopRefuse' };
        return { ...state, scene:'dialog', activeNpc:npcId, dialogLines:npc.greeting, dialogIndex:0, dialogPhase:'shopGreeting' };
      }
      if (npc.isPartsShop) {
        if (state.parts.includes(npc.wantsPart))
          return { ...state, scene:'dialog', activeNpc:npcId, dialogLines:npc.greeting, dialogIndex:0, dialogPhase:'partsShopGreeting' };
        return { ...state, scene:'dialog', activeNpc:npcId, dialogLines:[...npc.greeting, npc.noPartMessage], dialogIndex:0, dialogPhase:'partsShopRefuse' };
      }
      return { ...state, scene:'dialog', activeNpc:npcId, dialogLines:npc.greeting, dialogIndex:0, dialogPhase:'greeting' };
    }
    case 'NEXT_LINE': {
      if (state.dialogIndex < state.dialogLines.length - 1) return { ...state, dialogIndex:state.dialogIndex+1 };
      const dp = state.dialogPhase;
      if (dp === 'shopGreeting') {
        const nb = [...state.bikes, 'cub50'];
        return { ...state, bikes:nb, bikesEverOwned:[...new Set([...state.bikesEverOwned,'cub50'])], dialogLines:['スーパーカブ50 を手に入れた！'], dialogIndex:0, dialogPhase:'done' };
      }
      if (dp === 'shopRefuse' || dp === 'afterChat' || dp === 'partsShopRefuse')
        return { ...state, scene:'explore', activeNpc:null, dialogPhase:'idle', dialogLines:[], dialogIndex:0 };
      if (dp === 'partsShopGreeting') return { ...state, dialogPhase:'partsShopChoice' };
      if (dp === 'partsExchangeDone') return { ...state, scene:'explore', activeNpc:null, dialogPhase:'idle', dialogLines:[], dialogIndex:0 };
      if (dp === 'greeting') return { ...state, dialogPhase:'choice' };
      if (dp === 'correct') return { ...state, dialogPhase:'exchangeReady' };
      if (dp === 'correctAfter' || dp === 'done' || dp === 'hiddenEvent')
        return { ...state, scene:'explore', activeNpc:null, dialogPhase:'idle', dialogLines:[], dialogIndex:0 };
      if (dp === 'wrong') return { ...state, dialogPhase:'choice' };
      if (dp === 'gameClearAfter') return state;
      return state;
    }
    case 'PICK_BIKE': return { ...state, scene:'bikeSelect' };
    case 'SHOW': {
      const npc = NPCS[state.activeNpc]; const bid = action.bikeId;
      if (state.gameClear && state.activeNpc === 'legend' && bid === 'cub50' && npc.hiddenEvent)
        return { ...state, scene:'dialog', selectedBike:bid, dialogLines:npc.hiddenEvent, dialogIndex:0, dialogPhase:'hiddenEvent' };
      const ok = Array.isArray(npc.wants) ? npc.wants.includes(bid) : bid === npc.wants;
      if (ok) {
        const cl = npc.correctMap ? npc.correctMap[bid] : npc.correct;
        return { ...state, scene:'dialog', selectedBike:bid, dialogLines:cl, dialogIndex:0, dialogPhase:'correct' };
      }
      const wm = (npc.wrong && (npc.wrong[bid] || npc.wrong._default)) || 'うーん、それじゃないかな…';
      return { ...state, scene:'dialog', selectedBike:bid, dialogLines:[wm], dialogIndex:0, dialogPhase:'wrong' };
    }
    case 'EXCHANGE': {
      const npc = NPCS[state.activeNpc];
      const nb = state.bikes.filter(b => b !== state.selectedBike); nb.push(npc.gives);
      const np = [...state.parts]; const ne = [...new Set([...state.bikesEverOwned, npc.gives])];
      const { unlocked, msgs } = checkNewAreaUnlocks(nb, state.unlockedAreas);
      const lines = [BIKES[npc.gives].name + ' を手に入れた！', ...msgs, ...npc.correctAfter];
      if (npc.bonusPart) { np.push(npc.bonusPart); lines.push('📦 ' + PARTS[npc.bonusPart].name + ' を手に入れた！'); }
      const gc = npc.gives === 'hayabusa' ? true : state.gameClear;
      return { ...state, bikes:nb, parts:np, unlockedAreas:unlocked, bikesEverOwned:ne, gameClear:gc,
        selectedBike:null, dialogLines:lines, dialogIndex:0,
        dialogPhase:gc && npc.gives === 'hayabusa' ? 'gameClearAfter' : 'correctAfter' };
    }
    case 'PARTS_EXCHANGE': {
      const npc = NPCS[state.activeNpc];
      const np = state.parts.filter(p => p !== npc.wantsPart); np.push(npc.givesPart);
      return { ...state, parts:np, dialogLines:[...npc.correct, '📦 ' + PARTS[npc.givesPart].name + ' を手に入れた！'], dialogIndex:0, dialogPhase:'partsExchangeDone' };
    }
    case 'SYNTH': {
      const r = SYNTHESIS.find(x => x.id === action.recipeId); if (!r) return state;
      const nb = state.bikes.filter(b => b !== r.bike); nb.push(r.result);
      const np = state.parts.filter(p => p !== r.part);
      const ne = [...new Set([...state.bikesEverOwned, r.result])];
      const { unlocked } = checkNewAreaUnlocks(nb, state.unlockedAreas);
      return { ...state, bikes:nb, parts:np, unlockedAreas:unlocked, bikesEverOwned:ne, synthResult:r.result, scene:'synthResult' };
    }
    case 'GAME_CLEAR': return { ...state, phase:'gameClear' };
    case 'CONTINUE_AFTER_CLEAR':
      return { ...state, phase:'playing', scene:'explore', activeNpc:null, dialogPhase:'idle', dialogLines:[], dialogIndex:0 };
    case 'BACK_DIALOG': return { ...state, scene:'dialog', dialogPhase:'choice' };
    case 'LEAVE': return { ...state, scene:'explore', activeNpc:null, dialogPhase:'idle', dialogLines:[], dialogIndex:0, selectedBike:null };
    case 'OPEN_MAP': return { ...state, scene:'map' };
    case 'OPEN_INV': return { ...state, scene:'inventory' };
    case 'OPEN_SYNTH': return { ...state, scene:'synthesis' };
    case 'GO_AREA': return { ...state, currentArea:action.areaId, npcIndex:0, scene:'explore' };
    case 'CLOSE': return { ...state, scene:'explore', synthResult:null };
    default: return state;
  }
}

/* ═══════════════════════════════════════════
   Dispatch with SE
   ═══════════════════════════════════════════ */
function dispatch(type, payload) {
  audio.unlock();
  const s = state;
  const click = () => audio.playSe('click');
  if (['NAV','OPEN_MAP','OPEN_INV','OPEN_SYNTH','CLOSE','BACK_DIALOG','LEAVE','PICK_BIKE','GO_AREA','START','PROLOGUE_END','GAME_CLEAR','CONTINUE_AFTER_CLEAR','CONTINUE'].includes(type)) click();
  if (type === 'TALK') audio.playSe('talk');
  if (type === 'EXCHANGE' || type === 'PARTS_EXCHANGE') audio.playSe('correct');
  if (type === 'SYNTH') audio.playSe('craft');
  if (type === 'SHOW') {
    const npc = NPCS[s.activeNpc];
    if (npc) {
      const ok = s.gameClear && s.activeNpc === 'legend' && payload?.bikeId === 'cub50'
        ? true : Array.isArray(npc.wants) ? npc.wants.includes(payload?.bikeId) : payload?.bikeId === npc.wants;
      audio.playSe(ok ? 'correct' : 'wrong');
    }
  }
  if (type === 'NEXT_LINE' && s.dialogPhase === 'shopGreeting' && s.dialogIndex >= s.dialogLines.length - 1) audio.playSe('cub');
  if (type === 'START') { audio.playBgm('title'); deleteSave(); }
  if (type === 'CONTINUE') { const sv = loadGame(); audio.playBgm(sv?.currentArea || 'street'); }

  const prevPhase = state.phase;
  const prevArea = state.currentArea;
  state = reducer(state, { type, ...payload });

  // SE: dialog phase transitions
  if (state.dialogPhase === 'wrong' && prevDialogPhase !== 'wrong') audio.playSe('wrong');
  prevDialogPhase = state.dialogPhase;

  // SE: area unlock
  if (state.unlockedAreas.length > prevAreasLen) audio.playSe('unlock');
  prevAreasLen = state.unlockedAreas.length;

  // BGM
  if (state.phase === 'prologue' && prevPhase !== 'prologue') audio.playBgm('title');
  else if (state.phase === 'gameClear' && prevPhase !== 'gameClear') audio.playBgm('ending');
  else if (state.phase === 'playing' && (prevPhase !== 'playing' || state.currentArea !== prevArea)) audio.playBgm(state.currentArea);

  // Auto-save
  if (state.phase === 'playing' || state.phase === 'gameClear') saveGame(state);

  render();
}

/* ═══════════════════════════════════════════
   HTML helpers
   ═══════════════════════════════════════════ */
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'className') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
      else el.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c == null) continue;
    if (typeof c === 'string' || typeof c === 'number') el.appendChild(document.createTextNode(c));
    else if (Array.isArray(c)) c.forEach(x => x && el.appendChild(x));
    else el.appendChild(c);
  }
  return el;
}

function btn(label, onClick, cls, extra) {
  const b = h('button', { className: 'ws-btn ' + (cls||'ws-btn-accent'), onClick, ...(extra||{}) }, label);
  return b;
}

function volCtrl() {
  const wrap = h('div', { style: { display:'flex', alignItems:'center', gap:'2px' } });
  const muteBtn = h('button', {
    style: { background:'none', border:'none', color:C.text, fontSize:'14px', cursor:'pointer', padding:'2px 4px', lineHeight:'1' },
    onClick: () => { audio.toggleMute(); render(); }
  }, audio.muted ? '🔇' : '🔊');
  const slider = h('input', {
    type: 'range', className: 'ws-vol', min: '0', max: '100',
    style: { width:'44px', cursor:'pointer' },
  });
  slider.value = audio.muted ? 0 : Math.round(audio.vol * 100);
  slider.addEventListener('input', e => { audio.setVol(parseInt(e.target.value) / 100); });
  wrap.appendChild(muteBtn);
  wrap.appendChild(slider);
  return wrap;
}

/* --- Playing (main game) --- */
function renderPlaying() {
  const area = AREAS[state.currentArea];
  const visNpcs = getVisibleNpcs(state.currentArea, state);
  const npcId = visNpcs[state.npcIndex] || visNpcs[0];
  const npc = NPCS[npcId];

  const shell = h('div', { style: { fontFamily:"'Noto Sans JP',sans-serif", color:C.text, background:C.bg, position:'relative', width:'100%', height:'100%', overflow:'hidden', display:'flex', flexDirection:'column' } });
  shell.appendChild(h('img', { src: area.bg, alt:'', className:'ws-bg-img' }));
  shell.appendChild(h('div', { className:'ws-overlay', style: { background:'linear-gradient(to bottom, rgba(26,26,46,.3) 0%, rgba(26,26,46,.85) 100%)' } }));

  const content = h('div', { className:'ws-content' });

  // Top bar
  const topBar = h('div', { style: { display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 12px 6px', flexShrink:'0', position:'relative', zIndex:'10' } });
  const leftInfo = h('div', { style: { display:'flex', alignItems:'center', gap:'6px' } });
  leftInfo.appendChild(volCtrl());
  const areaLabel = h('span', { style: { fontSize:'13px', fontWeight:'700', opacity:'.7' } }, area.emoji + ' ' + area.name);
  if (state.gameClear) areaLabel.appendChild(h('span', { style: { marginLeft:'6px', color:C.gold, fontSize:'11px' } }, '🏆'));
  leftInfo.appendChild(areaLabel);
  topBar.appendChild(leftInfo);

  const rightBtns = h('div', { style: { display:'flex', gap:'6px' } });
  rightBtns.appendChild(hdrBtn('🔧' + (state.parts.length > 0 ? ' ' + state.parts.length : ''), () => dispatch('OPEN_SYNTH')));
  rightBtns.appendChild(hdrBtn('📦 ' + state.bikes.length, () => dispatch('OPEN_INV')));
  rightBtns.appendChild(hdrBtn('🗺️', () => dispatch('OPEN_MAP')));
  topBar.appendChild(rightBtns);
  content.appendChild(topBar);

  // Scene
  if (state.scene === 'explore' && npc) content.appendChild(renderExplore(npc, npcId, visNpcs));
  else if (state.scene === 'dialog') content.appendChild(renderDialog());
  else if (state.scene === 'bikeSelect') content.appendChild(renderBikeSelect());
  else if (state.scene === 'inventory') content.appendChild(renderInventory());
  else if (state.scene === 'map') content.appendChild(renderMap());
  else if (state.scene === 'synthesis') content.appendChild(renderSynthesis());
  else if (state.scene === 'synthResult') content.appendChild(renderSynthResult());

  shell.appendChild(content);
  root.appendChild(shell);
}

function hdrBtn(label, onClick) {
  return h('button', {
    className: 'ws-btn ws-btn-card',
    style: { padding:'5px 10px', fontSize:'12px' },
    onClick
  }, label);
}

/* --- Explore --- */
function renderExplore(npc, npcId, visNpcs) {
  const wrap = h('div', { style: { flex:'1', display:'flex', flexDirection:'column' } });

  const center = h('div', { style: { flex:'1', display:'flex', alignItems:'center', justifyContent:'center', padding:'0 16px' } });
  const inner = h('div', { style: { display:'flex', flexDirection:'column', alignItems:'center', animation:'ws-fadeIn .4s ease-out', width:'100%' } });
  inner.appendChild(h('img', { src: npc.image, alt: npc.name, className:'ws-npc-img', style: { animation:'ws-float 3s ease-in-out infinite' } }));
  inner.appendChild(h('p', { style: { fontSize:'16px', fontWeight:'700', marginTop:'8px', textAlign:'center', textShadow:'0 1px 4px rgba(0,0,0,.6)' } }, npc.name));

  const idle = h('p', { style: { fontSize:'14px', opacity:'.75', marginTop:'4px', fontStyle:'italic', textAlign:'center', lineHeight:'1.6', whiteSpace:'pre-line', padding:'0 8px' } });
  idle.textContent = '「' + npc.idle + '」';
  inner.appendChild(idle);
  center.appendChild(inner);
  wrap.appendChild(center);

  // Bottom nav
  const bottom = h('div', { style: { padding:'12px 16px 20px', background:'linear-gradient(to top, rgba(26,26,46,.95) 60%, rgba(26,26,46,0) 100%)', flexShrink:'0' } });
  const navRow = h('div', { style: { display:'flex', alignItems:'center', gap:'10px', maxWidth:'480px', margin:'0 auto' } });

  if (visNpcs.length > 1) navRow.appendChild(btn('◀', () => dispatch('NAV', { dir: -1 }), 'ws-btn ws-btn-card', { style: { padding:'12px 16px', fontSize:'18px' } }));
  navRow.appendChild(btn('話しかける', () => dispatch('TALK'), 'ws-btn ws-btn-accent', { style: { flex:'1', padding:'14px 0', fontSize:'16px' } }));
  if (visNpcs.length > 1) navRow.appendChild(btn('▶', () => dispatch('NAV', { dir: 1 }), 'ws-btn ws-btn-card', { style: { padding:'12px 16px', fontSize:'18px' } }));

  bottom.appendChild(navRow);
  wrap.appendChild(bottom);
  return wrap;
}

/* --- Dialog --- */
function renderDialog() {
  const npc = NPCS[state.activeNpc];
  const line = state.dialogLines[state.dialogIndex] || '';
  const last = state.dialogIndex >= state.dialogLines.length - 1;
  const dp = state.dialogPhase;

  const wrap = h('div', { style: { flex:'1', display:'flex', flexDirection:'column' } });

  if (npc) {
    const imgWrap = h('div', { style: { flex:'1', display:'flex', alignItems:'center', justifyContent:'center' } });
    const anim = dp === 'correct' ? 'ws-popIn .4s ease-out' : dp === 'wrong' ? 'ws-shake .4s' : '';
    imgWrap.appendChild(h('img', { src: npc.image, alt: npc.name, className:'ws-npc-img', style: { animation: anim } }));
    wrap.appendChild(imgWrap);
  }

  const bottom = h('div', { style: { padding:'0 12px 20px', background:'linear-gradient(to top, rgba(26,26,46,.95) 60%, rgba(26,26,46,0) 100%)', flexShrink:'0' } });
  const inner = h('div', { style: { maxWidth:'480px', margin:'0 auto' } });

  const dialogBox = h('div', {
    className: 'ws-card',
    style: { background:'rgba(22,33,62,.95)', border:'1px solid rgba(255,255,255,.1)', minHeight:'90px',
      cursor: last && !['choice','exchangeReady','partsShopChoice'].includes(dp) ? 'default' : 'pointer',
      animation:'ws-fadeUp .3s ease-out', textAlign:'center' },
    onClick: () => { if (['choice','exchangeReady','partsShopChoice'].includes(dp)) return; dispatch('NEXT_LINE'); }
  });
  if (npc) dialogBox.appendChild(h('p', { style: { fontSize:'16px', fontWeight:'700', color:C.accent, marginBottom:'6px' } }, npc.name));

  const lineP = h('p', { style: { fontSize:'15px', lineHeight:'1.7', whiteSpace:'pre-line' } });
  lineP.textContent = line;
  dialogBox.appendChild(lineP);

  if (!last) dialogBox.appendChild(h('p', { style: { fontSize:'12px', opacity:'.5', marginTop:'6px' } }, '▼'));
  inner.appendChild(dialogBox);

  // Action buttons
  if (dp === 'choice') {
    const row = h('div', { style: { display:'flex', gap:'8px', marginTop:'8px', animation:'ws-fadeIn .3s ease-out' } });
    row.appendChild(btn('バイクを見せる', () => dispatch('PICK_BIKE'), 'ws-btn ws-btn-accent', { style: { flex:'1', fontSize:'15px' } }));
    row.appendChild(btn('やめる', () => dispatch('LEAVE'), 'ws-btn ws-btn-card', { style: { flex:'1', fontSize:'15px' } }));
    inner.appendChild(row);
  }
  if (dp === 'exchangeReady') {
    const row = h('div', { style: { marginTop:'8px', animation:'ws-fadeIn .3s ease-out' } });
    row.appendChild(btn('交換する！', () => dispatch('EXCHANGE'), 'ws-btn ws-btn-success', { style: { width:'100%', fontSize:'15px' } }));
    inner.appendChild(row);
  }
  if (dp === 'partsShopChoice') {
    const row = h('div', { style: { display:'flex', gap:'8px', marginTop:'8px', animation:'ws-fadeIn .3s ease-out' } });
    row.appendChild(btn('交換する', () => dispatch('PARTS_EXCHANGE'), 'ws-btn ws-btn-success', { style: { flex:'1', fontSize:'15px' } }));
    row.appendChild(btn('やめる', () => dispatch('LEAVE'), 'ws-btn ws-btn-card', { style: { flex:'1', fontSize:'15px' } }));
    inner.appendChild(row);
  }
  if (dp === 'gameClearAfter' && last) {
    const row = h('div', { style: { marginTop:'8px', animation:'ws-fadeIn .3s ease-out' } });
    row.appendChild(btn('🏁 ゲームクリア！', () => dispatch('GAME_CLEAR'), 'ws-btn ws-btn-gold', { style: { width:'100%', fontSize:'16px' } }));
    inner.appendChild(row);
  }
  if (dp === 'done' || dp === 'partsExchangeDone' || dp === 'hiddenEvent' || (dp === 'correctAfter' && last)) {
    const row = h('div', { style: { marginTop:'8px', animation:'ws-fadeIn .3s ease-out' } });
    row.appendChild(btn('戻る', () => dispatch('LEAVE'), 'ws-btn ws-btn-card', { style: { width:'100%', fontSize:'15px' } }));
    inner.appendChild(row);
  }

  bottom.appendChild(inner);
  wrap.appendChild(bottom);
  return wrap;
}

/* --- Bike Select --- */
function renderBikeSelect() {
  const wrap = h('div', { className:'ws-scene-col' });
  wrap.appendChild(h('h2', { style: { fontSize:'15px', fontWeight:'700', textAlign:'center', margin:'12px 0 8px', animation:'ws-fadeIn .3s ease-out', flexShrink:'0' } }, 'どのバイクを見せる？'));

  const scroll = h('div', { className:'ws-scroll' });
  state.bikes.forEach((bid, i) => {
    const b = BIKES[bid]; if (!b) return;
    const card = h('button', {
      className:'ws-card',
      style: { display:'flex', alignItems:'center', gap:'12px', cursor:'pointer', width:'100%',
        border: b.isCustom ? '1px solid ' + C.gold + '44' : '1px solid rgba(255,255,255,.1)',
        animation: 'ws-slideIn .3s ease-out ' + (i * .05) + 's both' },
      onClick: () => dispatch('SHOW', { bikeId: bid })
    });
    card.appendChild(h('img', { src: b.icon, alt: b.name, style: { width:'52px', height:'52px', objectFit:'contain' } }));
    const info = h('div', { style: { textAlign:'left' } });
    const nameP = h('p', { style: { fontSize:'14px', fontWeight:'700' } });
    if (b.isCustom) nameP.appendChild(h('span', { style: { color:C.gold, marginRight:'4px' } }, '★'));
    nameP.appendChild(document.createTextNode(b.name));
    info.appendChild(nameP);
    info.appendChild(h('p', { style: { fontSize:'11px', opacity:'.6' } }, b.cc + ' / ' + b.category));
    card.appendChild(info);
    scroll.appendChild(card);
  });
  wrap.appendChild(scroll);

  const pad = h('div', { className:'ws-bottom-pad' });
  pad.appendChild(btn('戻る', () => dispatch('BACK_DIALOG'), 'ws-btn ws-btn-card', { style: { width:'100%', fontSize:'14px' } }));
  wrap.appendChild(pad);
  return wrap;
}

/* --- Inventory --- */
function renderInventory() {
  const wrap = h('div', { className:'ws-scene-col' });
  wrap.appendChild(h('h2', { style: { fontSize:'15px', fontWeight:'700', textAlign:'center', margin:'12px 0 8px', flexShrink:'0' } }, '所持バイク'));

  const scroll = h('div', { className:'ws-scroll' });
  if (state.bikes.length === 0) scroll.appendChild(h('p', { style: { textAlign:'center', opacity:'.6', marginTop:'16px' } }, 'バイクを持っていません'));

  state.bikes.forEach((bid, i) => {
    const b = BIKES[bid]; if (!b) return;
    const card = h('div', { className:'ws-card', style: { display:'flex', alignItems:'center', gap:'12px', border: b.isCustom ? '1px solid '+C.gold+'44' : '1px solid rgba(255,255,255,.08)', animation:'ws-slideIn .3s ease-out '+(i*.05)+'s both' } });
    card.appendChild(h('img', { src: b.icon, alt: b.name, style: { width:'52px', height:'52px', objectFit:'contain' } }));
    const info = h('div');
    const nameP = h('p', { style: { fontSize:'14px', fontWeight:'700' } });
    if (b.isCustom) nameP.appendChild(h('span', { style: { color:C.gold, marginRight:'4px' } }, '★'));
    nameP.appendChild(document.createTextNode(b.name));
    info.appendChild(nameP);
    info.appendChild(h('p', { style: { fontSize:'11px', opacity:'.6' } }, b.cc + ' / ' + b.category + ' / ' + b.price));
    card.appendChild(info);
    scroll.appendChild(card);
  });

  if (state.parts.length > 0) {
    scroll.appendChild(h('h3', { style: { fontSize:'14px', fontWeight:'700', textAlign:'center', margin:'16px 0 6px' } }, '所持パーツ'));
    state.parts.forEach((pid, i) => {
      const p = PARTS[pid]; if (!p) return;
      const card = h('div', { className:'ws-card', style: { display:'flex', alignItems:'center', gap:'12px', border:'1px solid rgba(255,255,255,.08)', animation:'ws-slideIn .3s ease-out '+(i*.05)+'s both' } });
      card.appendChild(h('span', { style: { fontSize:'24px', width:'52px', textAlign:'center', display:'inline-block' } }, '🔧'));
      const info = h('div');
      info.appendChild(h('p', { style: { fontSize:'14px', fontWeight:'700' } }, p.name));
      info.appendChild(h('p', { style: { fontSize:'11px', opacity:'.6' } }, p.desc));
      card.appendChild(info);
      scroll.appendChild(card);
    });
  }
  wrap.appendChild(scroll);

  const pad = h('div', { className:'ws-bottom-pad' });
  pad.appendChild(btn('閉じる', () => dispatch('CLOSE'), 'ws-btn ws-btn-card', { style: { width:'100%', fontSize:'14px' } }));
  wrap.appendChild(pad);
  return wrap;
}

/* --- Map --- */
function renderMap() {
  const wrap = h('div', { className:'ws-scene-col' });
  wrap.appendChild(h('h2', { style: { fontSize:'15px', fontWeight:'700', textAlign:'center', margin:'12px 0 8px', flexShrink:'0' } }, 'エリアマップ'));

  const scroll = h('div', { className:'ws-scroll' });
  Object.values(AREAS).forEach((a, i) => {
    const ok = state.unlockedAreas.includes(a.id);
    const card = h('button', {
      className:'ws-card',
      style: { width:'100%', cursor: ok ? 'pointer' : 'not-allowed', opacity: ok ? '1' : '.4',
        border: state.currentArea === a.id ? '2px solid '+C.accent : '1px solid rgba(255,255,255,.1)',
        display:'flex', alignItems:'center', gap:'12px',
        backgroundImage: ok ? 'linear-gradient(135deg,rgba(22,33,62,.9),rgba(22,33,62,.7)),url('+a.bg+')' : '',
        backgroundSize:'cover', backgroundPosition:'center',
        animation:'ws-fadeIn .3s ease-out '+(i*.1)+'s both' },
      onClick: () => ok && dispatch('GO_AREA', { areaId: a.id })
    });
    if (!ok) card.disabled = true;
    card.appendChild(h('span', { style: { fontSize:'26px' } }, ok ? a.emoji : '🔒'));
    const info = h('div', { style: { textAlign:'left' } });
    info.appendChild(h('p', { style: { fontSize:'15px', fontWeight:'700' } }, a.name));
    info.appendChild(h('p', { style: { fontSize:'11px', opacity:'.6' } }, ok ? 'NPC: '+getVisibleNpcs(a.id, state).length+'人' : '???'));
    card.appendChild(info);
    if (state.currentArea === a.id) card.appendChild(h('span', { style: { marginLeft:'auto', fontSize:'11px', color:C.accent, fontWeight:'700' } }, '現在地'));
    scroll.appendChild(card);
  });
  wrap.appendChild(scroll);

  const pad = h('div', { className:'ws-bottom-pad' });
  pad.appendChild(btn('閉じる', () => dispatch('CLOSE'), 'ws-btn ws-btn-card', { style: { width:'100%', fontSize:'14px' } }));
  wrap.appendChild(pad);
  return wrap;
}

/* --- Synthesis --- */
function renderSynthesis() {
  const wrap = h('div', { className:'ws-scene-col' });
  wrap.appendChild(h('h2', { style: { fontSize:'15px', fontWeight:'700', textAlign:'center', margin:'12px 0 8px', flexShrink:'0' } }, '🔧 合成'));

  const scroll = h('div', { className:'ws-scroll' });
  SYNTHESIS.forEach((r, i) => {
    const hb = state.bikes.includes(r.bike), hp = state.parts.includes(r.part), can = hb && hp;
    const bd = BIKES[r.bike], pd = PARTS[r.part], rd = BIKES[r.result];
    if (!bd || !pd || !rd) return;

    const card = h('div', { className:'ws-card', style: { opacity: can ? '1' : '.45', border: can ? '1px solid '+C.gold+'66' : '1px solid rgba(255,255,255,.08)', animation:'ws-fadeIn .3s ease-out '+(i*.1)+'s both' } });

    const icons = h('div', { style: { display:'flex', alignItems:'center', gap:'6px', justifyContent:'center', marginBottom:'6px' } });
    icons.appendChild(h('img', { src: bd.icon, alt:'', style: { width:'36px', height:'36px', objectFit:'contain', opacity: hb ? '1' : '.3' } }));
    icons.appendChild(h('span', { style: { fontWeight:'700' } }, '+'));
    icons.appendChild(h('span', { style: { fontSize:'18px', opacity: hp ? '1' : '.3' } }, '🔧'));
    icons.appendChild(h('span', { style: { fontWeight:'700' } }, '='));
    icons.appendChild(h('img', { src: rd.icon, alt:'', style: { width:'36px', height:'36px', objectFit:'contain' } }));
    card.appendChild(icons);

    card.appendChild(h('p', { style: { fontSize:'12px', textAlign:'center', opacity:'.8' } }, bd.name + ' + ' + pd.name));
    card.appendChild(h('p', { style: { fontSize:'13px', fontWeight:'700', textAlign:'center', color:C.gold, marginTop:'2px' } }, '→ ' + rd.name));

    if (can) {
      card.appendChild(btn('合成する！', () => dispatch('SYNTH', { recipeId: r.id }), 'ws-btn ws-btn-success', { style: { width:'100%', marginTop:'8px', fontSize:'14px' } }));
    }
    scroll.appendChild(card);
  });

  if (state.parts.length > 0) {
    scroll.appendChild(h('h3', { style: { fontSize:'13px', fontWeight:'700', textAlign:'center', margin:'14px 0 6px', opacity:'.7' } }, '所持パーツ'));
    const flexWrap = h('div', { style: { display:'flex', flexWrap:'wrap', gap:'6px', justifyContent:'center', marginBottom:'8px' } });
    state.parts.forEach(pId => {
      const p = PARTS[pId]; if (!p) return;
      flexWrap.appendChild(h('span', { className:'ws-card', style: { padding:'6px 10px', fontSize:'11px', margin:'0' } }, '🔧 ' + p.name));
    });
    scroll.appendChild(flexWrap);
  }
  wrap.appendChild(scroll);

  const pad = h('div', { className:'ws-bottom-pad' });
  pad.appendChild(btn('閉じる', () => dispatch('CLOSE'), 'ws-btn ws-btn-card', { style: { width:'100%', fontSize:'14px' } }));
  wrap.appendChild(pad);
  return wrap;
}

/* --- Synth Result --- */
function renderSynthResult() {
  const b = BIKES[state.synthResult]; if (!b) return h('div');
  const wrap = h('div', { style: { flex:'1', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'0 16px', animation:'ws-fadeIn .5s ease-out' } });
  wrap.appendChild(h('p', { style: { fontSize:'14px', opacity:'.7', marginBottom:'12px' } }, '🔧 合成成功！'));

  const glowWrap = h('div', { style: { animation:'ws-glow 2s infinite', borderRadius:'16px', padding:'20px' } });
  glowWrap.appendChild(h('img', { src: b.icon, alt: b.name, style: { width:'140px', height:'140px', objectFit:'contain', animation:'ws-popIn .5s ease-out' } }));
  wrap.appendChild(glowWrap);

  wrap.appendChild(h('p', { style: { fontSize:'18px', fontWeight:'900', color:C.gold, marginTop:'12px' } }, '★ ' + b.name));
  wrap.appendChild(h('p', { style: { fontSize:'12px', opacity:'.6', marginTop:'4px' } }, b.cc + ' / ' + b.category + ' / ' + b.price));
  wrap.appendChild(btn('OK', () => dispatch('CLOSE'), 'ws-btn ws-btn-accent', { style: { marginTop:'28px', padding:'12px 44px', fontSize:'16px' } }));
  return wrap;
}

/* ═══════════════════════════════════════════
   Boot
   ═══════════════════════════════════════════ */
render();
</script>
</body>
</html>
