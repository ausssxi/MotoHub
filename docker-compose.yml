services:
  # Laravel App (PHP-FPM + Python Scraper)
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    image: motohub-app
    container_name: motohub-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      # Laravel本体
      - ./backend:/var/www
      # Scraperを/var/wwwの外にマウントすることで、backend配下に空フォルダができるのを防ぎます
      - ./scraper:/var/scraper
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_HOST=db
      - DB_PORT=3306
      # Laravel側のパス設定
      - IMAGE_STORAGE_PATH=/var/www/storage/app/public/listings
    depends_on:
      - db
      - redis

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: motohub-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # Database (MySQL)
  db:
    image: mysql:8.0
    container_name: motohub-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db-data:/var/lib/mysql

  # Redis for Queues
  redis:
    image: redis:alpine
    container_name: motohub-redis

  # MailHog
  mailhog:
    image: mailhog/mailhog
    container_name: motohub-mailhog
    restart: unless-stopped
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"
      - "${MAIL_UI_PORT:-8025}:8025"

volumes:
  db-data: