services:
  # Laravel App (PHP-FPM + Python Scraper)
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    image: motohub-app
    container_name: motohub-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./scraper:/var/scraper
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_HOST=db
      - DB_PORT=3306
      - IMAGE_STORAGE_PATH=/var/www/storage/app/public/listings
    depends_on:
      - db
      - redis

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: motohub-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443" # ✨ HTTPS用のポートを開放
    volumes:
      - ./backend:/var/www
      # ✨ 本番用のSSL対応設定ファイルを読み込む
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # ✨ ホストOSにあるSSL証明書をコンテナ内から見れるようにマウント
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

  # Database (MySQL)
  db:
    image: mysql:8.0
    container_name: motohub-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql

  # Redis for Queues
  redis:
    image: redis:alpine
    container_name: motohub-redis

  # MailHog
  mailhog:
    image: mailhog/mailhog
    container_name: motohub-mailhog
    restart: unless-stopped
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"
      - "${MAIL_UI_PORT:-8025}:8025"

volumes:
  db-data: