services:
  # Laravel App (PHP-FPM + Python Scraper)
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    image: motohub-app
    container_name: motohub-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./scraper:/var/scraper
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_HOST=db
      - DB_PORT=3306
      - IMAGE_STORAGE_PATH=/var/www/storage/app/public/listings
      # Botと同居させる場合は以下も必要ですが、今回は分けているのでなくてOK
      # - X_API_KEY=${X_API_KEY}
    depends_on:
      - db
      - redis
      - meilisearch

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: motohub-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/${NGINX_CONF:-default.conf}:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

  # Database (MySQL)
  db:
    image: mysql:8.0
    container_name: motohub-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      # ★ 127.0.0.1 にだけバインドして外部公開しない。app は Docker ネットワーク（DB_HOST=db）で
      #   接続するためホスト側ポートは通らず、閉じても動作に影響しない。localhost からの
      #   GUI ツール接続（TablePlus 等）は従来どおり可能。
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql

  # Meilisearch (全文検索エンジン)
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: motohub-meilisearch
    restart: unless-stopped
    ports:
      # ★ 127.0.0.1 にだけバインド。app は MEILISEARCH_HOST=http://meilisearch:7700 で
      #   Docker ネットワーク接続するためホスト側ポートは不要。
      - "127.0.0.1:7700:7700"
    env_file:
      - ./backend/.env  # ★ここを追加！Laravelの.envを読み込ませる
    environment:
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili-data:/meili_data

  # Redis for Queues
  redis:
    image: redis:alpine
    container_name: motohub-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2000mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data

  # MailHog（開発専用のメール捕捉ツール）
  # ★ profiles: ["dev"] により、dev プロファイル有効時のみ起動する。
  #   本番は resend(API送信)でMailHog不要なので、COMPOSE_PROFILES を設定しなければ起動しない。
  #   ローカルは .env の COMPOSE_PROFILES=dev（.env.example に記載）で従来どおり自動起動する。
  mailhog:
    image: mailhog/mailhog
    container_name: motohub-mailhog
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      # ★ ローカル専用。127.0.0.1 にだけバインド（捕捉メール閲覧UIを外部公開しない）。
      - "127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"

volumes:
  db-data:
  meili-data:
  redis-data: