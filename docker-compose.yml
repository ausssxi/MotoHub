version: '3'

services:
  # Laravel App (PHP-FPM + Python Scraper)
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    image: motohub-app
    container_name: motohub-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./scraper:/var/scraper
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_HOST=db
      - DB_PORT=3306
      - IMAGE_STORAGE_PATH=/var/www/storage/app/public/listings
      # Botと同居させる場合は以下も必要ですが、今回は分けているのでなくてOK
      # - X_API_KEY=${X_API_KEY}
    depends_on:
      - db
      - redis
      - meilisearch

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: motohub-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/${NGINX_CONF:-default.conf}:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

  # Database (MySQL)
  db:
    image: mysql:8.0
    container_name: motohub-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql

  # Meilisearch
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: motohub-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY:-masterKey} # .envのキーを使用
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili-data:/meili_data

  # Redis for Queues
  redis:
    image: redis:alpine
    container_name: motohub-redis

  # MailHog
  mailhog:
    image: mailhog/mailhog
    container_name: motohub-mailhog
    restart: unless-stopped
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"
      - "${MAIL_UI_PORT:-8025}:8025"
      
volumes:
  db-data:
  meili-data: